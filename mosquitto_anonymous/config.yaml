---
version: 1.0.0
slug: mosquitto_anonymous
name: Mosquitto broker (anonymous)
description: Mosquitto MQTT broker that accepts all clients, with or without credentials
url: https://github.com/Edgar-Grigoryan/mosquitto-anonymous-addon
arch:
  - aarch64
  - amd64
discovery:
  - mqtt
map:
  - ssl
  - share
options:
  log_dest: []
  log_type: []
  require_certificate: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  customize:
    active: false
    folder: mosquitto
ports:
  1883/tcp: 1883
  1884/tcp: 1884
  8883/tcp: 8883
  8884/tcp: 8884
schema:
  log_dest:
    - list(none|stdout|stderr|topic)?
  log_type:
    - list(none|debug|error|warning|notice|information|subscribe|unsubscribe|websockets|all)?
  require_certificate: bool
  certfile: str
  cafile: str?
  keyfile: str
  customize:
    active: bool
    folder: str
  debug: bool?
services:
  - mqtt:provide
startup: system
init: false
